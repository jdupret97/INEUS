name: Repository checks

on: [push, pull_request]

jobs:
  configuration-and-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python scripts/validate_repository.py
      - run: bash -n scripts/run_linear.slurm scripts/run_nonlinear.slurm scripts/run_black_scholes.slurm
      - run: bash -n scripts/run_linear_black_scholes.slurm
      - run: python -m unittest discover -s tests -v
      - run: python -m ineus --config configs/linear.yaml --dry-run
      - run: python -m ineus --config configs/nonlinear.yaml --mode ineus --dry-run
      - run: python -m ineus --config configs/linear_sweep.yaml --dry-run
      - run: python -m ineus --config configs/nonlinear_sweep.yaml --dry-run
      - run: python -m ineus --config configs/linear_sweep_smoke.yaml --mode comparison --dry-run
      - run: python -m ineus --config configs/nonlinear_sweep_smoke.yaml --dimension 100 --jump-intensity 0 --dry-run
      - run: python -m ineus --config configs/black_scholes.yaml --dry-run
      - run: python -m ineus --config configs/black_scholes_smoke.yaml --dry-run
      - run: python -m ineus --config configs/linear_black_scholes.yaml --dry-run
      - run: python -m ineus --config configs/linear_black_scholes_smoke.yaml --dry-run
